<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stickiwiki — Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { theme: { extend: {
  fontFamily: { head: ['Space Grotesk','sans-serif'], body: ['Inter','sans-serif'] },
  colors: { lime: '#C6FF3A', pink: '#FF3ABF', ink: '#0F1115', card: '#171A21' }
} } };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0F1115;color:#EDEDED}</style>
</head>
<body class="font-body min-h-screen">

<!-- ============== CONFIG: same project as index.html ============== -->
<script>
const CONFIG = {
  SUPABASE_URL: "https://yikbqpmzrjvkhxdvlkqw.supabase.co",
  SUPABASE_KEY: "sb_publishable_H9GJW6Zxbg2rtAqpA26n5Q_6yQd5oX7",
};
const supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
</script>

<!-- ============== LOGIN ============== -->
<div id="loginBox" class="max-w-sm mx-auto mt-24 p-6 bg-card rounded-xl">
  <h1 class="font-head font-bold text-xl mb-4">🔑 Admin Login</h1>
  <input id="loginEmail" placeholder="Email" class="w-full p-3 mb-3 rounded-lg bg-white/5">
  <input id="loginPass" type="password" placeholder="Password" class="w-full p-3 mb-3 rounded-lg bg-white/5">
  <button onclick="login()" class="w-full py-3 rounded-full bg-lime text-ink font-head font-bold">Login</button>
  <p id="loginError" class="text-pink text-sm mt-2"></p>
</div>

<!-- ============== ADMIN APP ============== -->
<div id="adminApp" class="hidden max-w-5xl mx-auto p-5">
  <div class="flex justify-between items-center mb-6">
    <h1 class="font-head font-bold text-2xl">Stickiwiki Admin</h1>
    <button onclick="logout()" class="text-sm px-4 py-2 rounded-full border border-white/20">Sign out</button>
  </div>

  <div class="flex gap-2 mb-6">
    <button data-tab="dash" class="tabBtn px-4 py-2 rounded-full bg-lime text-ink font-bold">📊 Dashboard</button>
    <button data-tab="products" class="tabBtn px-4 py-2 rounded-full bg-white/10">🏷️ Stickers</button>
  </div>

  <!-- DASHBOARD -->
  <section id="tab-dash">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-card p-4 rounded-xl"><p class="text-xs text-white/50">Total Orders</p><p id="statOrders" class="text-2xl font-head font-bold">–</p></div>
      <div class="bg-card p-4 rounded-xl"><p class="text-xs text-white/50">Total Revenue</p><p id="statRevenue" class="text-2xl font-head font-bold">–</p></div>
      <div class="bg-card p-4 rounded-xl col-span-2"><p class="text-xs text-white/50">Best Seller</p><p id="statBest" class="text-2xl font-head font-bold">–</p></div>
    </div>
    <h2 class="font-head font-bold mb-3">🏆 Top Sellers</h2>
    <div id="topSellers" class="mb-8 space-y-1"></div>
    <h2 class="font-head font-bold mb-3">🧾 Recent Orders</h2>
    <div id="recentOrders" class="space-y-2"></div>
  </section>

  <!-- PRODUCTS -->
  <section id="tab-products" class="hidden">
    <div class="bg-card p-4 rounded-xl mb-6">
      <h2 class="font-head font-bold mb-3">Add New Sticker</h2>
      <div class="grid md:grid-cols-4 gap-2">
        <input id="newTitle" placeholder="Title" class="p-2.5 rounded-lg bg-white/5">
        <input id="newPrice" type="number" placeholder="Price (EGP)" class="p-2.5 rounded-lg bg-white/5">
        <input id="newCat" placeholder="Category" class="p-2.5 rounded-lg bg-white/5">
        <input id="newImg" placeholder="Image URL" class="p-2.5 rounded-lg bg-white/5">
      </div>
      <button onclick="addProduct()" class="mt-3 px-5 py-2 rounded-full bg-lime text-ink font-head font-bold text-sm">+ Add Sticker</button>
    </div>
    <div id="productList" class="space-y-2"></div>
  </section>
</div>

<script>
/* ================= AUTH ================= */
async function login(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error){ document.getElementById('loginError').textContent = error.message; return; }
  showApp();
}
async function logout(){ await supabaseClient.auth.signOut(); location.reload(); }
async function checkSession(){
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) showApp();
}
function showApp(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminApp').classList.remove('hidden');
  loadDashboard(); loadProducts();
}
checkSession();

/* ================= TABS ================= */
document.querySelectorAll('.tabBtn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabBtn').forEach(x => x.className = 'tabBtn px-4 py-2 rounded-full bg-white/10');
  b.className = 'tabBtn px-4 py-2 rounded-full bg-lime text-ink font-bold';
  document.getElementById('tab-dash').classList.toggle('hidden', b.dataset.tab !== 'dash');
  document.getElementById('tab-products').classList.toggle('hidden', b.dataset.tab !== 'products');
});

/* ================= DASHBOARD ================= */
async function loadDashboard(){
  const { data: orders, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
  if (error){ console.warn(error); return; }

  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statRevenue').textContent = orders.reduce((s,o)=>s+Number(o.total||0),0) + ' EGP';

  const sales = {};
  orders.forEach(o => (o.items||[]).forEach(it => { sales[it.name] = (sales[it.name]||0) + Number(it.units||0); }));
  const ranked = Object.entries(sales).sort((a,b)=>b[1]-a[1]);
  document.getElementById('statBest').textContent = ranked[0] ? `${ranked[0][0]} (${ranked[0][1]} sold)` : '–';
  document.getElementById('topSellers').innerHTML = ranked.slice(0,10).map(([name,qty]) => `
    <div class="flex justify-between bg-card px-4 py-2 rounded-lg"><span>${name}</span><b>${qty} sold</b></div>`).join('') || '<p class="text-white/40 text-sm">No orders yet.</p>';

  document.getElementById('recentOrders').innerHTML = orders.slice(0,20).map(o => `
    <div class="bg-card px-4 py-3 rounded-lg text-sm">
      <div class="flex justify-between font-bold"><span>${o.order_id||'#'+o.id}</span><span>${o.total} EGP</span></div>
      <div class="text-white/50">${o.customer_name||''} · ${o.customer_phone||''}</div>
      <div class="text-white/40 text-xs">${new Date(o.created_at).toLocaleString()}</div>
    </div>`).join('') || '<p class="text-white/40 text-sm">No orders yet.</p>';
}

/* ================= PRODUCTS CRUD ================= */
async function loadProducts(){
  const { data, error } = await supabaseClient.from('products').select('*').order('id');
  if (error){ console.warn(error); return; }
  document.getElementById('productList').innerHTML = data.map(p => `
    <div class="bg-card p-3 rounded-lg flex items-center gap-3">
      <img src="${p.img}" class="w-12 h-12 rounded object-cover">
      <div class="flex-1 grid md:grid-cols-4 gap-2">
        <input value="${p.title}" id="t-${p.id}" class="p-2 rounded bg-white/5 text-sm">
        <input value="${p.price}" type="number" id="p-${p.id}" class="p-2 rounded bg-white/5 text-sm">
        <input value="${p.category}" id="c-${p.id}" class="p-2 rounded bg-white/5 text-sm">
        <input value="${p.img}" id="i-${p.id}" class="p-2 rounded bg-white/5 text-sm">
      </div>
      <button onclick="saveProduct(${p.id})" class="px-3 py-2 rounded-full bg-lime text-ink text-xs font-bold">Save</button>
      <button onclick="deleteProduct(${p.id})" class="px-3 py-2 rounded-full bg-pink text-white text-xs font-bold">Delete</button>
    </div>`).join('');
}
async function addProduct(){
  const title = document.getElementById('newTitle').value.trim();
  const price = Number(document.getElementById('newPrice').value);
  const category = document.getElementById('newCat').value.trim();
  const img = document.getElementById('newImg').value.trim();
  if (!title || !price || !category || !img) return alert('Fill all fields');
  const { error } = await supabaseClient.from('products').insert([{ title, price, category, img }]);
  if (error) return alert('Error: ' + error.message);
  ['newTitle','newPrice','newCat','newImg'].forEach(id => document.getElementById(id).value = '');
  loadProducts();
}
async function saveProduct(id){
  const title = document.getElementById(`t-${id}`).value;
  const price = Number(document.getElementById(`p-${id}`).value);
  const category = document.getElementById(`c-${id}`).value;
  const img = document.getElementById(`i-${id}`).value;
  const { error } = await supabaseClient.from('products').update({ title, price, category, img }).eq('id', id);
  if (error) alert('Error: ' + error.message); else alert('Saved!');
}
async function deleteProduct(id){
  if (!confirm('Delete this sticker?')) return;
  const { error } = await supabaseClient.from('products').delete().eq('id', id);
  if (error) alert('Error: ' + error.message); else loadProducts();
}
</script>
</body>
</html>
